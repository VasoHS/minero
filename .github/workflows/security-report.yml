name: security-report

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Usa las mismas versiones que fija el Dockerfile (descarga de binarios
      # fijados en lugar de ejecutar un script remoto).
      - name: Instalar Syft y Grype
        run: |
          set -eux
          arch="$(dpkg --print-architecture)"
          case "${arch}" in
            amd64) goarch="amd64" ;;
            arm64) goarch="arm64" ;;
            *) echo "Arquitectura no soportada: ${arch}" >&2; exit 1 ;;
          esac
          curl -fsSL -o /tmp/syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v1.51.0/syft_1.51.0_linux_${goarch}.tar.gz"
          sudo tar -xzf /tmp/syft.tar.gz -C /usr/local/bin syft
          curl -fsSL -o /tmp/grype.tar.gz \
            "https://github.com/anchore/grype/releases/download/v0.120.0/grype_0.120.0_linux_${goarch}.tar.gz"
          sudo tar -xzf /tmp/grype.tar.gz -C /usr/local/bin grype
          syft version
          grype version

      - run: pip install -e .

      - name: Generar reporte
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: miner report --output reports/security-report.md

      - name: Publicar resumen
        run: cat reports/security-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-report
          path: reports/security-report.md

      - name: Guardar reporte en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/security-report.md
          git diff --cached --quiet || git commit -m "chore(reporter): actualizar reporte de seguridad"
          git push