[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "github-codeql-miner"
version = "0.1.0"
description = "Miner automatizado para análisis de vulnerabilidades con CodeQL"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0"
]

[project.scripts]
miner = "miner.cli:app"

[tool.setuptools.package-data]
# El Visualizer embebe sus assets CSS/JS; deben viajar en el paquete instalado.
"miner.visualizer" = ["assets/*.css", "assets/*.js"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    # Solo para tests: valida el documento/ejemplo contra el JSON Schema del
    # contrato y evita divergencias entre validate_document y el schema.
    "jsonschema>=4.0"
]
analyzer = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "nbformat>=5.9",
    "nbclient>=0.9",
    "ipykernel>=6.0"
]

[tool.pytest.ini_options]
# Evita que pytest recoja artefactos generados (p. ej. workdir/ con repos clonados).
testpaths = ["tests"]
